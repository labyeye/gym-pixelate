version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: nestgym-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: nestgym-backend
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/nestgym
      - JWT_SECRET=nestgym_dev_jwt_secret_change_in_prod
      - JWT_EXPIRE=30d
      - CLIENT_URL=http://localhost:8081
      - FACE_SERVICE_URL=http://face-service:8000
    depends_on:
      - mongodb
      - face-service
    volumes:
      - ./backend/uploads:/app/uploads
    restart: unless-stopped

  face-service:
    build: ./face-service
    container_name: nestgym-face-service
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/nestgym
      - MATCH_THRESHOLD=0.68
    depends_on:
      - mongodb
    volumes:
      - face_uploads:/app/uploads
    restart: unless-stopped

volumes:
  mongo_data:
  face_uploads:
