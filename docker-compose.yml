version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: nestgym-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: nestgym-backend
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/nestgym
      - JWT_SECRET=nestgym_dev_jwt_secret_change_in_prod
      - JWT_EXPIRE=30d
      - CLIENT_URL=http://localhost:8081
    depends_on:
      - mongodb
    volumes:
      - ./backend/uploads:/app/uploads
    restart: unless-stopped

volumes:
  mongo_data:
