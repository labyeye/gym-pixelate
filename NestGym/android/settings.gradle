pluginManagement { includeBuild("../node_modules/@react-native/gradle-plugin") }
plugins { id("com.facebook.react.settings") }
extensions.configure(com.facebook.react.ReactSettingsExtension){ ex -> ex.autolinkLibrariesFromCommand() }
rootProject.name = 'NestGym'
include ':app'
includeBuild('../node_modules/@react-native/gradle-plugin')

// react-native-print ships with compileSdk 31 hard-coded; AndroidX/React Native need 34+ or the release build fails.
gradle.beforeProject { p ->
    if (p.name == "react-native-print") {
        p.afterEvaluate {
            p.android.compileSdkVersion = 37
            p.android.buildToolsVersion = "37.0.0"
        }
    }
}
